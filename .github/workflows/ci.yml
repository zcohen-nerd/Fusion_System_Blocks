name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Lint: ruff (configured in pyproject.toml)
  # -------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Pinned: `ruff format` gained Markdown/embedded-snippet formatting in a
      # later release, which reformats Python examples inside .github/*.md docs
      # that are not project source. Pin the version and scope the format check
      # to the actual Python packages.
      - name: Install ruff
        run: pip install ruff==0.16.5
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check fsb_core fusion_addin src tests scripts

  # -------------------------------------------------------------------
  # Type-check: mypy on core/
  # -------------------------------------------------------------------
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install mypy jsonschema
          pip install -e .
      - name: Run mypy
        run: mypy fsb_core/ --ignore-missing-imports

  # -------------------------------------------------------------------
  # Test: JS modules (delta utils, editor core, router, catalogs) plus
  # a static sweep that fails on calls to nonexistent editor/renderer
  # methods — the class of bug the palette UI has shipped before.
  # -------------------------------------------------------------------
  js-test:
    name: Test (JS harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Run JS test harness
        run: node tests/js/run-tests.js

  # -------------------------------------------------------------------
  # Test: pytest on multiple Python versions with coverage
  # -------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Only this job publishes a check run (dorny/test-reporter); the other
    # jobs stay read-only.
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=fsb_core \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=results.xml \
            -q
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Test Report
        if: always() && matrix.python-version == '3.11'
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        with:
          name: Pytest Results
          path: results.xml
          reporter: java-junit

